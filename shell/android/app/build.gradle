plugins {
    id 'com.android.application'
}

// The upload keystore and its passwords live OUTSIDE the repo, in
// ~/.playconsole/private/favor-upload.properties (same law the ASC .p8 and
// GVT's keystore live under). Absent that file, release builds are simply
// unsigned.
def signProps = new Properties()
def signPropsFile = new File(System.getProperty('user.home'), '.playconsole/private/favor-upload.properties')
if (signPropsFile.exists()) {
    signPropsFile.withInputStream { signProps.load(it) }
}

android {
    namespace 'com.corkscrewgames.favor'
    compileSdk 35

    defaultConfig {
        applicationId "com.corkscrewgames.favor"
        minSdk 28
        targetSdk 35
        // vc1 is BURNED — it is the AAB that went to production 2026-07-30 and is
        // what the store serves today. Play rejects a re-upload of a used
        // versionCode, so every future build steps this by one.
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            if (signPropsFile.exists()) {
                storeFile new File(signProps.getProperty('storeFile'))
                storePassword signProps.getProperty('storePassword')
                keyAlias signProps.getProperty('keyAlias')
                keyPassword signProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // Play Billing (Star Shipments). 8.x satisfies Play's Aug 2026 minimum of
    // Billing 8+; the AAR merges com.android.vending.BILLING and the two
    // ProxyBillingActivity entries into our hand-written manifest, which is
    // why that manifest still lists only INTERNET.
    implementation 'com.android.billingclient:billing:8.3.0'
}
